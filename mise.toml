min_version = "2026.10.25"
monorepo_root = true

[settings]
experimental = true
use_versions_host = false
use_versions_host_track = false
lockfile = true
locked = true

# Native lockfiles still own application dependencies. These are build/test SDKs.
# Rustup selects the Rust toolchain from rust-toolchain.toml.
[tools]
node = "24.22.0"
pnpm = "11.28.6"
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }
"aqua:neovim/neovim" = "0.12.6"
"aqua:max-sixty/worktrunk" = "0.81.0"

[monorepo]
config_roots = ["home", "src/*", "src/claude/*", "private/src/*"]

[tasks.check]
description = "Complete fast gate, without installation or cloud CI"
depends = ["check:typescript", "//src/pi:check", "//src/pi-kit:check", "//home:check", "//src/codediff.nvim:check"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --workspace --all-features --all-targets -- -D warnings",
  "cargo nextest run --locked --workspace --all-features --all-targets",
  "cargo test --locked --workspace --all-features --doc",
  "cargo doc --locked --workspace --all-features --no-deps",
]
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks."check:typescript"]
description = "Typecheck tooling and lint/format all owned TypeScript and JavaScript"
run = ["pnpm run typecheck:tooling", "pnpm run lint", "pnpm run format:check"]

[tasks.verify]
description = "Complete checks and isolated process/host acceptance"
depends = ["check", "//src/pi:verify", "//src/codediff.nvim:verify"]
run = "cargo nextest run --locked --workspace --all-features --all-targets --profile acceptance"

[tasks.deps]
description = "Explicitly install locked development and test dependencies"
run = ["pnpm install --frozen-lockfile", "cargo fetch --locked"]

[tasks.doctor]
description = "Native mise diagnostics, selected SDKs, and compiler identity"
depends = ["doctor:platform"]
# The rustc on PATH must be the one rust-toolchain.toml pins (rustup's proxy).
run = ["mise doctor", "mise ls --current", "rustup show active-toolchain", 'want=$(sed -n "s/^channel = \"\(.*\)\"/\1/p" rust-toolchain.toml) && have=$(rustc --version | cut -d" " -f2) && test "$have" = "$want" || { echo "rustc $have on PATH ($(command -v rustc)) is not the rust-toolchain.toml pin $want" >&2; exit 1; }', "cargo clippy --version", "cargo fmt --version", "cc --version"]

[tasks."doctor:platform"]
skip_if = 'test "$(uname -s)" != Darwin'
run = "xcrun --show-sdk-path"
