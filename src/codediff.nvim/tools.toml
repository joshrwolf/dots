# Native binaries for this plugin, shared by machine setup and the test tasks.
# The FFI declarations in lua/codediff/core/diff.lua must match the library release.
# Linux releases need glibc and the system libgomp.so.1.

[tools."github:esmuellert/codediff.nvim"]
version = "4.0.6"
bin = "libvscode_diff"

[tools."github:esmuellert/codediff.nvim".platforms]
macos-arm64 = { asset_pattern = "libvscode_diff_macos_arm64_{{ version }}.dylib" }
linux-x64 = { asset_pattern = "libvscode_diff_linux_x64_{{ version }}.so" }
linux-arm64 = { asset_pattern = "libvscode_diff_linux_arm64_{{ version }}.so" }

[tools."github:esmuellert/codediff"]
version = "0.23.2"

[tools."github:esmuellert/codediff".platforms]
macos-arm64 = { asset_pattern = "codediff-watcher-{{ version }}-macos-arm64.tar.gz" }
linux-x64 = { asset_pattern = "codediff-watcher-{{ version }}-linux-x64.tar.gz" }
linux-arm64 = { asset_pattern = "codediff-watcher-{{ version }}-linux-arm64.tar.gz" }
