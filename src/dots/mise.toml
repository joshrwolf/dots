[tasks.build]
run = 'cargo install --frozen --path . --root "$MISE_MONOREPO_ROOT/dist" --force'
cache = { enabled = false }

[tasks.check]
extends = "rust-check"
vars = { package = "dots-cli" }
depends = ["^check", ":skills-check"]
cache = { enabled = false }

[tasks."skills-check"]
run = 'cargo run --locked --quiet -p dots-cli -- skills check --output "$MISE_MONOREPO_ROOT/skills/dots"'
cache = { enabled = false }

[tasks.install]
dir = "{{ config_root }}/../.."
depends = [":build", ":skills-check"]
run = [
  "mkdir -p home/cli/.local/bin",
  '{{ vars.stow }} --target "$HOME" --simulate --restow cli skills',
  "cargo install --frozen --path src/dots --root home/cli/.local --force",
  '{{ vars.stow }} --target "$HOME" --restow cli skills',
]
cache = { enabled = false }

[tasks.skills]
run = 'cargo run --locked --quiet -p dots-cli -- skills generate --output "$MISE_MONOREPO_ROOT/skills/dots"'
cache = { enabled = false }
