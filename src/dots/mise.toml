[tasks.check]
extends = "rust-check"
vars = { package = "dots-cli" }
depends = ["^check", ":skills-check"]
cache = { enabled = false }

[tasks."skills-check"]
run = 'cargo run --locked --quiet -p dots-cli -- skills check --output "$MISE_MONOREPO_ROOT/skills/dots"'
cache = { enabled = false }

[tasks.install]
description = "Install dots into Cargo's bin directory"
run = "cargo install --locked --path ."
cache = { enabled = false }

[tasks.skills]
run = 'cargo run --locked --quiet -p dots-cli -- skills generate --output "$MISE_MONOREPO_ROOT/skills/dots"'
cache = { enabled = false }
