[tasks.check]
extends = "rust-check"
vars = { package = "herdr-github" }
depends = ["^check"]
cache = { enabled = false }

[tasks.build]
run = 'cargo install --frozen --path . --root "$MISE_MONOREPO_ROOT/dist" --force'
cache = { enabled = false }

[tasks.install]
description = "Register this plugin from a verified immutable release"
depends = [":build"]
run = 'python3 "$MISE_MONOREPO_ROOT/src/herdr/deploy/main.py" github'
cache = { enabled = false }

[tasks.prepare]
description = "Explicit Herdr source-install callback"
run = "cargo install --frozen --path . --root . --force"
cache = { enabled = false }
