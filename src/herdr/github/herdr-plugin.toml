id = "herdr-github"
name = "GitHub"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "GitHub status and workflows for herdr workspaces"
platforms = ["macos", "linux"]

[[build]]
command = ["mise", "run", ":prepare"]

[[actions]]
id = "ci-refresh"
title = "Refresh GitHub CI status"
contexts = ["workspace"]
command = ["./bin/herdr-github"]

[[actions]]
id = "ci-fix"
title = "Fix failing GitHub CI now"
contexts = ["workspace"]
command = ["./bin/herdr-github"]

[[startup]]
command = ["./bin/herdr-github"]

[[actions]]
id = "status-service"
title = "GitHub status service health"
contexts = ["global", "workspace"]
command = ["./bin/herdr-github"]

[[events]]
on = "workspace.created"
command = ["./bin/herdr-github"]

[[events]]
on = "workspace.closed"
command = ["./bin/herdr-github"]

[[actions]]
id = "open-link"
title = "Open GitHub link in browser"
contexts = ["pane"]
command = ["./bin/herdr-github"]

[[events]]
on = "workspace.focused"
command = ["./bin/herdr-github"]

[[panes]]
id = "ci-arm"
title = "Watch GitHub CI and autofix"
placement = "split"
command = ["./bin/herdr-github"]

[[panes]]
id = "ci-brief"
title = "GitHub CI brief"
placement = "overlay"
command = ["./bin/herdr-github"]

[[link_handlers]]
id = "github"
title = "Open GitHub link"
pattern = "^https://github\\.com/[^/]+/[^/]+/(pull|issues)/[0-9]+"
action = "open-link"

[[link_handlers]]
id = "actions-run"
title = "Open GitHub Actions run"
pattern = "^https://github\\.com/[^/]+/[^/]+/actions/runs/[0-9]+"
action = "open-link"

# Open one of the workspace's registered PRs in the browser.
[[panes]]
id = "prs"
title = "Open registered PR"
placement = "popup"
command = ["./bin/herdr-github"]
width = 120
height = 16
