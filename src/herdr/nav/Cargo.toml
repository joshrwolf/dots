[package]
name = "herdr-nav"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "herdr-nav"
path = "src/main.rs"

[dependencies]
herdrkit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
herdrkit = { workspace = true, features = ["testing"] }
dots-process.workspace = true
nix = { workspace = true, features = ["term", "fs"] }
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
