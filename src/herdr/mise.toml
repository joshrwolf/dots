[tasks.deps]
depends = ["//src/herdr/review:deps"]

# Plugins register first, so restowed key bindings never name a missing action.
[tasks.install]
dir = "{{config_root}}/../.."
depends = ["./...:install"]
run = [
  '{{vars.stow}} --target="$HOME" --restow --simulate herdr nvim',
  '{{vars.stow}} --target="$HOME" --restow herdr nvim',
]
