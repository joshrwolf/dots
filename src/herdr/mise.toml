[tasks.deps]
depends = ["//src/herdr/review:deps"]
cache = { enabled = false }

# Plugins register first, so restowed key bindings never name a missing action.
# herdr-issue and herdr-review are also user commands on PATH.
[tasks.install]
dir = "{{config_root}}/../.."
depends = ["./...:install"]
run = [
  'mkdir -p home/herdr/.local',
  '{{vars.stow}} --target="$HOME" --restow --simulate herdr nvim',
  'cargo install --frozen --path src/herdr/issue --root home/herdr/.local --force',
  'cargo install --frozen --path src/herdr/review --root home/herdr/.local --force',
  '{{vars.stow}} --target="$HOME" --restow herdr nvim',
]
cache = { enabled = false }
