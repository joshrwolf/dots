[tasks.deps]
run = "npm ci --ignore-scripts"
cache = { enabled = false }

[tasks.build]
depends = [":package"]
cache = { enabled = false }

[tasks.package]
dir = "{{ config_root }}/../.."
run = [
  "rm -rf dist/pi-package",
  "mkdir -p dist/pi-package",
  "npm pack ./src/pi --offline --ignore-scripts --json --pack-destination dist/pi-package > dist/pi-package/artifact.json",
]
sources = ["src/pi/extensions/**", "src/pi/src/**", "src/pi/themes/**", "src/pi/package.json", "src/pi/npm-shrinkwrap.json", "src/pi/.npmignore", "src/pi/.npmrc", "src/pi/README*", "src/pi/LICENSE*", "src/pi/LICENCE*", "src/pi/mise.toml", "mise.toml", "mise.lock"]
outputs = ["dist/pi-package"]
cache = { enabled = true, env = ["NODE_OPTIONS", "NODE_ENV", "NPM_CONFIG_USERCONFIG"] }

[tasks.prepare]
dir = "{{ config_root }}/../.."
depends = [":package"]
run = [
  "node src/pi/install/artifact.mjs validate-archive",
  "rm -rf dist/pi-runtime",
  "mkdir -p dist/pi-runtime",
  "tar -xzf dist/pi-package/*.tgz --strip-components=1 -C dist/pi-runtime",
  "npm ci --prefix dist/pi-runtime --omit=dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund",
  "node src/pi/install/artifact.mjs seal-runtime",
]
cache = { enabled = false }

[tasks.verify]
depends = [":check", ":prepare"]
run = [
  "node --test tests/acceptance/*.test.mjs",
  "python3 -m unittest discover -s tests/acceptance -p test_terminal.py -v",
]
env = { PYTHONDONTWRITEBYTECODE = "1" }
cache = { enabled = false }

[tasks."verify-host"]
depends = [":prepare"]
run = "node --test tests/acceptance/host.test.mjs"
cache = { enabled = false }

[tasks."verify-terminal"]
depends = [":prepare"]
run = "python3 -m unittest discover -s tests/acceptance -p test_terminal.py -v"
env = { PYTHONDONTWRITEBYTECODE = "1" }
cache = { enabled = false }

[tasks.install]
description = "Explicitly activate an immutable prepared companion; never reload Pi"
depends = [":prepare"]
run = "node install/index.mjs"
cache = { enabled = false }

[tasks.rollback]
run = "node install/index.mjs --rollback"
cache = { enabled = false }

[tasks."upstream-install"]
run = "node install/index.mjs --upstream"
cache = { enabled = false }

[tasks.check]
run = "npm run check"
cache = { enabled = false }
