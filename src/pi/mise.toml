[tasks.verify]
depends = [":check"]
run = 'PATH="$MISE_MONOREPO_ROOT/target/debug:$PATH" node --test "tests/acceptance/*.test.{mjs,ts}"'

[tasks."verify-host"]
run = "node --test tests/acceptance/host.test.mjs"

# Pi's interactive host in both TUI modes through its public virtual-terminal option.
[tasks."verify-terminal"]
run = "node --test tests/acceptance/terminal.test.mjs"

[tasks.workbench]
description = "Interactive fixture-only Pi UI; disposable home, no providers or installation"
run = "node dev/run.mjs"

[tasks.check]
depends = ["//src/dots:test-cli"]
run = 'PATH="$MISE_MONOREPO_ROOT/target/debug:$PATH" pnpm run check'
