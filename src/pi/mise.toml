[tasks.deps]
run = "npm ci --ignore-scripts"
cache = { enabled = false }

[tasks.verify]
depends = [":check"]
run = [
  "node --experimental-strip-types --test tests/acceptance/*.test.mjs tests/acceptance/*.test.ts",
  "python3 -m unittest discover -s tests/acceptance -p 'test*terminal.py' -v",
]
env = { PYTHONDONTWRITEBYTECODE = "1" }
cache = { enabled = false }

[tasks."verify-host"]
run = "node --test tests/acceptance/host.test.mjs"
cache = { enabled = false }

[tasks."verify-terminal"]
run = "python3 -m unittest discover -s tests/acceptance -p 'test*terminal.py' -v"
env = { PYTHONDONTWRITEBYTECODE = "1" }
cache = { enabled = false }

# Pi loads a local package from its path without copying; run only from the
# primary checkout. Reinstalling is harmless.
[tasks.install]
description = "Install dependencies, then register this checkout's companion with Pi; /reload when idle"
depends = [":deps"]
run = "pi install '{{ config_root }}'"
cache = { enabled = false }

# Pi replaces an older registration of the same npm package and keeps its filters.
[tasks.packages]
description = "Install pinned third-party Pi packages; /reload when idle"
run = "pi install npm:pi-web-access@0.41.0"
cache = { enabled = false }

[tasks.workbench]
description = "Interactive fixture-only Pi UI; disposable home, no providers or installation"
run = "node dev/run.mjs"
cache = { enabled = false }

[tasks.check]
run = "npm run check"
cache = { enabled = false }
