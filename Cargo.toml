[workspace]
resolver = "3"
members = [
    "tests",
    "src/herdr/prs",
    "src/tasks",
    "src/memory",
    "src/dots",
    "src/github/inspect",
    "src/herdr/tests",
    "src/github/client",
    "src/herdr/issue",
    "src/herdr/kit",
    "src/herdr/review/core",
    "src/herdr/find",
    "src/herdr/github",
    "src/herdr/nav",
    "src/herdr/review",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
herdr-prs = { path = "src/herdr/prs" }
clap = { version = "4", features = ["derive"] }
github-inspect = { path = "src/github/inspect" }
github-client = { path = "src/github/client" }
dots-tasks = { path = "src/tasks" }
dots-memory = { path = "src/memory" }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros", "fs", "process"] }
herdrkit = { path = "src/herdr/kit" }
herdr-review = { path = "src/herdr/review" }
review-core = { path = "src/herdr/review/core" }
anyhow = "1"
nucleo = "0.5"
nix = { version = "0.29", features = ["process", "signal"] }
ratatui = "0.30"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# A plugin binary is spawned on a keypress, so its startup cost is the budget.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
