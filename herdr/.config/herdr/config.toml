onboarding = false

[theme]
# GitHub Light Default, matching the selected Ghostty theme.
name = "one-light"
auto_switch = false

[theme.custom]
sidebar_bg = "#f6f8fa"
active_row_bg = "#ddf4ff"
selection_bg = "#b6e3ff"
panel_bg = "#ffffff"
text = "#1f2328"
overlay0 = "#57606a"
# Selected tabs use accent as background and panel_bg as text; retain contrast.
accent = "#526d91"
surface0 = "#f6f8fa"
overlay1 = "#57606a"
blue = "#0969da"
green = "#1a7f37"
red = "#cf222e"
yellow = "#9a6700"
mauve = "#8250df"

[ui]
status_indicators = "symbols"
agent_panel_sort = "priority"
tab_bar_position = "bottom"
pane_outer_borders = false
pane_gaps = false

# The GitHub plugin publishes these workspace tokens. Missing values and
# empty rows disappear, so workspaces without a PR keep the compact layout.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [
    { token = "$gh_pr", fg = "#0969da", dim = false },
    { token = "$gh_state", fg = "#1a7f37", dim = false, rules = [
      { equals = "○ Draft", fg = "#57606a" },
      { equals = "◆ Merged", fg = "#8250df" },
      { equals = "× Closed", fg = "#cf222e" },
    ] },
  ],
  [
    { token = "$gh_failed", fg = "#cf222e", bold = true, dim = false },
    { token = "$gh_pending", fg = "#9a6700", dim = false },
    { token = "$gh_checks", fg = "#57606a", dim = false, rules = [
      { equals = "✓ CI", fg = "#1a7f37" },
    ] },
    { token = "$gh_health", fg = "#9a6700", dim = false },
  ],
]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
done_path = "sounds/work-complete.mp3"
request_path = "sounds/something-need-doing.mp3"

[keys]
prefix = "ctrl+s"
# Global back-and-forth, including panes in other spaces; Ghostty sends Cmd+O here.
last_pane = "prefix+shift+o"

# Tabs use h/j/k/l so Cmd+H/J/K/L can map cleanly through Ghostty.
new_tab = ["prefix+t", "prefix+c"]
previous_tab = ["prefix+h", "prefix+k", "prefix+p"]
next_tab = ["prefix+l", "prefix+j"]
move_tab_previous = "prefix+alt+h"
move_tab_next = "prefix+alt+l"

# Keep pane navigation distinct from the tab bindings above.
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

split_vertical = ["prefix+|", "prefix+v"]
split_horizontal = "prefix+minus"

resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
# Resize panes with the direct bindings above.
resize_mode = []

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-find --entrypoint picker"
description = "find anything (workspaces, agents, worktrees, dirs)"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nav.left"
description = "focus left / forward to the active application"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nav.down"
description = "focus down / forward to the active application"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nav.up"
description = "focus up / forward to the active application"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nav.right"
description = "focus right / forward to the active application"

# Ctrl+L is navigation now; use prefix then Ctrl+L to clear a shell screen.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_PANE_ID\" ctrl+l"
description = "send literal ctrl+l"
