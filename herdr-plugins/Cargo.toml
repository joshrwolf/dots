[workspace]
resolver = "3"
members = ["contracts", "crates/herdrkit", "find", "github", "nav", "nvim"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
herdrkit = { path = "crates/herdrkit" }
anyhow = "1"
nucleo = "0.5"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# A plugin binary is spawned on a keypress, so its startup cost is the budget.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
