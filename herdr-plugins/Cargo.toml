[workspace]
resolver = "3"
members = [
    "contracts",
    "crates/github-client",
    "crates/herdrkit",
    "crates/review-core",
    "find",
    "github",
    "nav",
    "nvim",
    "review",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
github-client = { path = "crates/github-client" }
herdrkit = { path = "crates/herdrkit" }
review-core = { path = "crates/review-core" }
anyhow = "1"
nucleo = "0.5"
nix = { version = "0.29", features = ["process", "signal"] }
ratatui = "0.30"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# A plugin binary is spawned on a keypress, so its startup cost is the budget.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
