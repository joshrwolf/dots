# --- Globals ---
prompt='󱝁 '

unbind C-b
set -g prefix C-s

set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"

set -g allow-passthrough on
set -g visual-activity off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g cursor-style blinking-bar

set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -g detach-on-destroy off
set -g focus-events on
set -g set-clipboard on
# Tell tmux these terminals support OSC 52 clipboard (needed for nested tmux over SSH)
set -as terminal-features ',xterm-ghostty:clipboard:extkeys'
set -as terminal-features ',tmux-256color:clipboard'
set -as terminal-features ',screen-256color:clipboard'

# very large history
set -g history-limit 10200

set -g base-index 1
setw -g pane-base-index 1
set -gs escape-time 0
set -s extended-keys on
set -s extended-keys-format csi-u
set -g -q mouse on
setw -g mode-keys vi

set -g renumber-windows on


# --- Bindings ---

unbind %
unbind '"'
unbind t
unbind-key p

bind t run-shell "cd '#{pane_current_path}' && $HOME/.local/bin/wt-tmux-new"
bind - split-window -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display-message "config reloaded"

bind h previous-window
bind l next-window
bind M-h swap-window -t -1\; previous-window
bind M-l swap-window -t +1\; next-window

bind -r H resize-pane -L 20
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 20

# switch to previous session (like ctrl+6 in vim)
bind o switch-client -l


# worktree dashboard
bind w display-popup -E -w 90% -h 80% "cd #{pane_current_path} && wt list --full"

bind-key "P" run-shell "sesh-picker"

bind p display-message -F "#{pane_current_path}"


# --- Styles ---
thm_bg="#ffffff"
thm_bg_dark="#ffffff"
thm_fg="#1F2328"
thm_gray="#b1bac4"
thm_magenta="#bc8cff"
thm_pink="#ff7b72"
thm_green="#3fb950"
thm_blue="#58a6ff"
thm_black="#484f58"
thm_yellow="#d29922"
thm_selected="#6e7681"
thm_match="#6e7681"

set-option -g set-titles on
set-option -g set-titles-string "#S / #W"
set-option -gw pane-border-indicators 'colour'
set-option -g pane-border-lines single
setw -g window-status-format "#[fg=${thm_gray}]#I #{?#{e|>:#{window_panes},1}, #{pane_current_command},#W}"
setw -g window-status-current-format "#[fg=${thm_green},bold]#I #{?#{e|>:#{window_panes},1}, #{pane_current_command},#W}"
set -g pane-active-border-style "fg=${thm_green}"
set -g pane-border-format "#{?pane_active,#[fg=${thm_green}],#[fg=${thm_fg},dim]}#{pane_current_command}#{?window_zoomed_flag, #[fg=white]#{pane_index}/#{window_panes},} "

set -g popup-border-style "fg=${thm_gray},bg=${thm_bg_dark}"
set -g popup-border-lines rounded

set -g status "on"
set -g status-style 'fg=white'
set -g status-position top
set -g status-left-length 50
set -g status-left "#[fg=#{?client_prefix,${thm_yellow},${thm_fg}},bg=${thm_bg_dark}]#S#[fg=${thm_fg},bg=default] ▸ "
set -g status-right-length 100
set -g status-right ""
set -g status-justify left
set -g status-interval 3

set -g message-style fg="${thm_blue}",bg="${thm_bg_dark}",align="centre"
set -g message-command-style fg="${thm_blue}",bg="${thm_gray}",align="centre"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# After plugins: lock down window names
setw -g automatic-rename off
setw -g allow-rename off
