[tools]
node = "latest"
pnpm = "{{ read_json(path='../package.json')['packageManager'] | split(pat='@') | last }}"
"npm:@earendil-works/pi-coding-agent" = "{{ read_yaml(path='../pnpm-workspace.yaml')['catalog']['@earendil-works/pi-coding-agent'] }}"
"aqua:max-sixty/worktrunk" = "latest"
"aqua:neovim/neovim" = "latest"
# MSAL runtime wheels support CPython through 3.14.
azure = { version = "latest", python = "3.14" }
claude = "latest"
codex = "latest"
cue = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gcloud = { version = "latest", depends = ["python"] }
# The macOS Cloud SDK installer requires this Python minor.
python = "3.14"
github-cli = "latest"
gitsign = "latest"
go = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
golangci-lint = "latest"
lua-language-server = "latest"
melange = "latest"
ripgrep = "latest"
semgrep = "latest"
starship = "latest"
stylua = "latest"
terraform = "latest"
tree-sitter = "latest"
uv = "latest"
yq = "latest"
zoxide = "latest"

[tools."http:rex"]
version = "0.1.0-preview.14"
os = ["linux"]

[tools."http:rex".platforms]
linux-x64 = { url = "https://blob.superlogical.com/download/rex/preview/7e460d02f51573990bfcdc6c44a5606d11c7d47a/rex-linux-amd64.tar.gz", checksum = "sha256:36ece39653ecc4c1a95ae0ddf9a728f9a3df2ab663488b970f991b1378ff940a" }
linux-arm64 = { url = "https://blob.superlogical.com/download/rex/preview/7e460d02f51573990bfcdc6c44a5606d11c7d47a/rex-linux-arm64.tar.gz", checksum = "sha256:4deb87bae6787972b580f4b71ad59515ddc8fa3228dc1e80578fe0a634f7ed3a" }
