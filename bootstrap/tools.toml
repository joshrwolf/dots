[tools]
node = "latest"
pnpm = "{{ read_json(path='../package.json')['packageManager'] | split(pat='@') | last }}"
"npm:@earendil-works/pi-coding-agent" = "{{ read_yaml(path='../pnpm-workspace.yaml')['catalog']['@earendil-works/pi-coding-agent'] }}"
"aqua:max-sixty/worktrunk" = "latest"
"aqua:neovim/neovim" = "latest"
# MSAL runtime wheels support CPython through 3.14.
azure = { version = "latest", python = "3.14" }
claude = "latest"
codex = "latest"
cue = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gcloud = { version = "latest", depends = ["python"] }
# The macOS Cloud SDK installer requires this Python minor.
python = "3.14"
github-cli = "latest"
gitsign = "latest"
go = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
golangci-lint = "latest"
lua-language-server = "latest"
melange = "latest"
ripgrep = "latest"
semgrep = "latest"
starship = "latest"
stylua = "latest"
terraform = "latest"
tree-sitter = "latest"
uv = "latest"
yq = "latest"
zoxide = "latest"

[tools."http:rex"]
version = "0.1.0-preview.13"
os = ["linux"]

[tools."http:rex".platforms]
linux-x64 = { url = "https://blob.superlogical.com/download/rex/preview/1b6654811346488b696ded8f3c7e6701c57242f1/rex-linux-amd64.tar.gz", checksum = "sha256:b7ee40e9f8ce199ad9992a7601536cd03f5d25166f63c06e6dc1cf866b773a5a" }
linux-arm64 = { url = "https://blob.superlogical.com/download/rex/preview/1b6654811346488b696ded8f3c7e6701c57242f1/rex-linux-arm64.tar.gz", checksum = "sha256:250e05847fedd78d6ca850a222f0db74038070150e3b502c165b111b3f286284" }
