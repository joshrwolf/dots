[bootstrap.user]
login_shell = "zsh"

[tools]
ruby = "latest"

[env]
_.path = ["{{ env.MISE_BREW_CASK_OPT_APPDIR | default(value='/Applications') }}/Rex Beta.app/Contents/Helpers/Rex Server.rex/Contents/MacOS"]

[bootstrap.hooks.pre-packages]
run = '"{{ mise_bin }}" -E "{{ mise_env | default(value=[]) | join(sep=",") }}" install ruby'

[bootstrap.hooks.post-tools]
run = '"{{ mise_bin }}" -E "{{ mise_env | default(value=[]) | join(sep=",") }}" run --skip-tools rex:agents'

[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew-cask:brave-browser" = { os = "macos" }
"brew-cask:finicky" = { os = "macos" }
"brew-cask:nikitabobko/tap/aerospace" = { os = "macos" }
"brew-cask:orbstack" = { os = "macos" }
"brew-cask:raycast" = { os = "macos" }

[bootstrap.packages."macos-app:rex"]
version = "0.1.0-1696"
url = "https://blob.superlogical.com/public/rex-app/preview-arm64/Rex-0.1.0-1696.dmg"
sha256 = "e500d137e4344b3d26e2f12fcfe11a25562f60eb563ac1c0a31ccd2ad6297248"
artifact = "Rex Beta.app"
os = "macos/arm64"
adopt = true

[dotfiles]
"~/.config/aerospace" = { source = "../home/aerospace/.config/aerospace", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.config/finicky" = { source = "../home/finicky/.config/finicky", mode = "symlink-each", variants = [{ os = "macos" }] }
