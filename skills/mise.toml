[tasks."install"]
dir = "{{config_root}}/.."
run = ['{{ vars.stow }} --target "$HOME" --simulate --restow skills', '{{ vars.stow }} --target "$HOME" --restow skills']
cache = { enabled = false }

[tasks."check"]
depends = ["//src/dots:skills-check"]
dir = "{{config_root}}/.."
run = [
  "claude plugin validate skills",
  "claude plugin validate skills/.local/share/agent-skills/golang/skills",
]
cache = { enabled = false }

[tasks."golang:import"]
dir = "{{config_root}}/.."
description = "Explicit Git subtree import; creates a local commit"
run = "git subtree add --prefix=skills/.local/share/agent-skills/golang https://github.com/samber/cc-skills-golang.git main --squash"
cache = { enabled = false }

[tasks."golang:update"]
dir = "{{config_root}}/.."
description = "Explicit upstream subtree merge; review source and discovery changes"
run = "git subtree pull --prefix=skills/.local/share/agent-skills/golang https://github.com/samber/cc-skills-golang.git main --squash"
cache = { enabled = false }
