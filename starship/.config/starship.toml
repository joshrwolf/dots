add_newline = true
# format = "$directory$line_break$character"
format = "$directory${custom.git_branch}${custom.jj}$line_break$character"

[character]
# success_symbol = "[λ](bold green)"
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"

# [line_break]
# disabled = true

[aws]
disabled = true

[golang]
disabled = true
format = '[ ](bold cyan)'

[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold green"

# Built-in git_branch can't be conditioned, so it's left out of `format` above.
# These two custom modules split the prompt: git branch in pure-git repos,
# jj change in jj repos. --ignore-working-copy is mandatory — without it every
# prompt render snapshots the working copy and writes to the op log.
[custom.git_branch]
description = "Git branch — hidden inside jj repos"
when = "! jj --ignore-working-copy --quiet root 2>/dev/null"
command = "git branch --show-current 2>/dev/null"
symbol = " "
format = "on [$symbol$output]($style) "
style = "bold green"

[custom.jj]
description = "Jujutsu working-copy change"
when = "jj --ignore-working-copy --quiet root 2>/dev/null"
command = '''jj log --ignore-working-copy --no-graph --color never -r @ -T 'separate(" ", change_id.shortest(4), bookmarks.map(|b| b.name()).join(" "), if(empty, "(empty)"), description.first_line())' 2>/dev/null'''
symbol = " "
format = "on [$symbol$output]($style) "
style = "bold purple"

[git_state]
disabled = false

[gcloud]
disabled = true

[directory]
truncate_to_repo = false
truncation_length = 5
read_only = " 󰌾"
truncation_symbol = "…/"

[directory.substitutions]
"~/.worktrees" = "@wt"
"~/dev/gh/chainguard/wts" = "@cgw"
"~/dev/gh/chainguard" = "@cg"
"~/dev/gh/wolfi" = "@wolfi"
"~/dev/gh/joshrwolf" = "@personal"
"~/dev/gh/kabbages-co" = "@lab"

[kubernetes]
disabled = true
symbol = '☸ '
